name: storeapp
description: "Event Store - a Flutter store app with Cubit and Bloc state management."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  google_fonts: ^9.0.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
